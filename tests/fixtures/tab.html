<!doctype html><html><head><meta charset="utf-8"><title>Tab share fixture</title><style>body{font:18px system-ui;margin:32px}.space{height:900px}.drag{display:inline-block;padding:24px;background:#bbf7d0}.drop{margin:20px;padding:40px;border:3px dashed #047857}iframe{width:90%;height:320px;border:2px solid #334155}</style></head><body><h1>Tab share interaction fixture</h1><button id="counter">Counter: 0</button><p><label>Text input <input id="input"></label></p><p><label>Textarea <textarea></textarea></label></p><div contenteditable="true">Editable text</div><p><label>Slider <input type="range" min="0" max="100" value="10"></label></p><div id="drag" class="drag" draggable="true">Drag text</div><div id="drop" class="drop">Drop outcome: waiting</div><iframe src="http://127.0.0.1:4101/frame.html" title="Cross-site fixture"></iframe><p><a href="?navigated=true">Same-tab navigation</a> · <a href="about:blank" target="_blank">New tab</a></p><p><input type="file"></p><button id="dialog">Open dialog</button><div class="space">Long scroll region</div><h2>Bottom target</h2><button>Bottom button</button><script>let count=0;document.querySelector('#counter').onclick=e=>e.target.textContent=`Counter: ${++count}`;document.querySelector('#drag').ondragstart=e=>e.dataTransfer.setData('text/plain','fixture text');document.querySelector('#drop').ondragover=e=>e.preventDefault();document.querySelector('#drop').ondrop=e=>{e.preventDefault();e.currentTarget.textContent=`Drop outcome: ${e.dataTransfer.getData('text/plain')}`};document.querySelector('#dialog').onclick=()=>alert('Host must dismiss this dialog locally.');</script></body></html>
