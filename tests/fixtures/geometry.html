<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Coordinate probe</title>
<style>
  html, body { margin: 0; padding: 0; background: #eee; font: 12px/1 monospace; }
  #rows { display: block; }
  .row { height: 2.5vh; box-sizing: border-box; border-top: 1px solid #999; background: #fff; width: 100%; }
  .row:nth-child(even) { background: #e8f0ff; }
  body.tall #rows { height: 200vh; }
  #out { position: fixed; right: 4px; top: 4px; background: #000; color: #0f0; padding: 6px; z-index: 9; white-space: pre; }
</style>
</head>
<body>
<div id="rows"></div>
<output id="out">none</output>
<script>
  const rows = document.getElementById('rows');
  for (let i = 0; i < 40; i++) {
    const cell = document.createElement('div');
    cell.className = 'row';
    cell.dataset.index = String(i);
    rows.append(cell);
  }
  window.hits = [];
  document.addEventListener('mousedown', (event) => {
    const cell = event.target.closest?.('.row');
    window.lastHit = cell ? Number(cell.dataset.index) : null;
    window.hits.push({ index: window.lastHit, x: event.clientX, y: event.clientY, button: event.button });
    document.getElementById('out').textContent =
      'last=' + window.lastHit + ' y=' + Math.round(event.clientY) + ' btn=' + event.button;
  });
  document.addEventListener('contextmenu', (event) => {
    window.lastContext = { x: event.clientX, y: event.clientY };
    document.getElementById('out').textContent = 'contextmenu y=' + Math.round(event.clientY);
    event.preventDefault();
  });
  if (new URLSearchParams(location.search).get('scroll') === '1') document.body.classList.add('tall');
</script>
</body>
</html>
