<!doctype html><html><head><meta charset="utf-8"><title>Cross-site frame</title></head><body><h2>Cross-site frame</h2><button id="counter">Frame counter: 0</button><label>Frame text <input></label><script>let count=0;document.querySelector('#counter').onclick=e=>e.target.textContent=`Frame counter: ${++count}`;</script></body></html>
